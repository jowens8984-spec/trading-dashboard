<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>STINKS</title>
<script>try { if (localStorage.getItem("stinks_boot") === "off") document.documentElement.classList.add("noboot"); } catch (e) {}</script>
<style>
  :root {
    --bg: #060708; --card: #0d0c09; --card2: #16130c; --line: #3b3016; --text: #f3e6c8;
    --muted: #a38d63; --green: #5fe08a; --red: #ff5c4d; --blue: #4fd8ff; --amber: #ffb000;
  }
  * { box-sizing: border-box; }
  button { touch-action: manipulation; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; }
  #app { max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 84px); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  .pill { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card2);
    color: var(--muted); white-space: nowrap; }
  .pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px;
    background: var(--muted); vertical-align: 1px; }
  .pill.live .dot { background: var(--green); box-shadow: 0 0 0 0 rgba(46,204,113,.6); animation: pulse 2s infinite; }
  .pill.warn .dot { background: var(--amber); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,204,113,.6); } 70% { box-shadow: 0 0 0 7px rgba(46,204,113,0); } 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); } }
  .icon-btn { background: none; border: 0; color: var(--muted); font-size: 20px; padding: 4px 6px; cursor: pointer; }
  .hero { margin: 14px 0 6px; }
  .hero .label { color: var(--muted); font-size: 13px; }
  .hero .equity { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .hero .pnl { font-size: 15px; font-weight: 600; }
  .pos { color: var(--green); } .neg { color: var(--red); } .muted { color: var(--muted); }
  .spark { margin-top: 6px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 22px 2px 8px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sym { font-size: 18px; font-weight: 700; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 2px;
    white-space: nowrap; display: inline-block; }
  .tag.open { background: rgba(79,216,255,.15); color: var(--blue); }
  .tag.win { background: rgba(46,204,113,.15); color: var(--green); }
  .tag.loss { background: rgba(255,92,92,.15); color: var(--red); }
  .tag.flat { background: var(--card2); color: var(--muted); }
  .sub { color: var(--muted); font-size: 13px; }
  .big { font-size: 17px; font-weight: 700; }
  .levels { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .levels b { color: var(--text); font-weight: 600; }
  .chart { margin-top: 8px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: var(--card2); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .feed .item { display: flex; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .feed .item:last-child { border-bottom: 0; }
  .side { font-size: 11px; font-weight: 800; width: 38px; text-align: center; padding: 3px 0; border-radius: 6px; }
  .side.buy { background: rgba(46,204,113,.15); color: var(--green); }
  .side.sell { background: rgba(255,92,92,.15); color: var(--red); }
  .feed .time { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: 14px; }
  .banner { background: rgba(245,185,66,.12); border: 1px solid rgba(245,185,66,.4); color: var(--amber);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .banner.err { background: rgba(255,92,92,.1); border-color: rgba(255,92,92,.4); color: #ff9a9a; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(-120%);
    top: calc(env(safe-area-inset-top) + 10px); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 10;
    transition: transform .3s ease; max-width: 92vw; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  form.setup { margin-top: 18px; }
  form.setup label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  form.setup input { width: 100%; background: var(--card2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 12px; font-size: 16px; font-family: ui-monospace, Menlo, monospace; }
  .btn { display: block; width: 100%; margin-top: 18px; background: var(--blue); color: #fff; border: 0;
    border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: var(--card2); color: var(--text); }
  .btn:disabled { opacity: .6; }
  .note { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .settings { margin-top: 10px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: rgba(6,7,8,.96);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .tabbar button { flex: 1; background: none; border: 0; color: var(--muted); padding: 9px 0 11px;
    font-size: 12px; font-weight: 600; cursor: pointer; }
  .tabbar button .ti { display: block; font-size: 20px; line-height: 1.25; }
  .tabbar button.on { color: var(--text); }
  .idx { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .idx .card { margin: 0; padding: 10px; }
  .idx .nm { font-size: 12px; color: var(--muted); }
  .idx .pr { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .idx .ch { font-size: 13px; font-weight: 600; }
  .idx svg { display: block; width: 100%; height: 34px; margin-top: 6px; }
  .q { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .q:last-child { border-bottom: 0; }
  .q .s { width: 58px; font-weight: 700; flex: none; }
  .q .held { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); margin-left: 4px; vertical-align: 2px; }
  .q .rng { flex: 1; height: 4px; background: var(--line); border-radius: 2px; position: relative; min-width: 40px; }
  .q .rng i { position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; margin-left: -5px; }
  .q .p { width: 62px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .q .c { width: 68px; text-align: right; font-weight: 700; font-size: 13px; padding: 3px 6px; border-radius: 6px;
    font-variant-numeric: tabular-nums; flex: none; }
  .c.up { background: rgba(46,204,113,.15); color: var(--green); }
  .c.dn { background: rgba(255,92,92,.15); color: var(--red); }
  .c.fl { background: var(--card2); color: var(--muted); }
  .qx { padding: 2px 0 10px; border-bottom: 1px solid var(--line); }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 9px 10px; font-size: 16px; text-transform: uppercase; }
  .addrow button { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 700; font-size: 15px; }
  .x { background: none; border: 0; color: var(--muted); font-size: 15px; padding: 2px 4px; cursor: pointer; flex: none; }
  /* options watch + quick trades */
  .ow + .ow { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .st { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .st.call { background: rgba(46,204,113,.15); color: var(--green); }
  .st.put { background: rgba(255,92,92,.15); color: var(--red); }
  .st.wait { background: var(--card2); color: var(--muted); }
  .st.late { background: rgba(245,185,66,.14); color: var(--amber); }
  .mtr { position: relative; height: 8px; margin: 14px 2px 6px; border-radius: 4px; background: var(--card2); }
  .mtr span { position: absolute; top: 0; bottom: 0; }
  .mtr i { position: absolute; top: -5px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
    background: #fff; border: 3px solid var(--card); box-sizing: border-box; }
  .mlab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .mlab b { font-weight: 700; }
  .qt { display: flex; gap: 8px; margin-top: 10px; }
  .qb { flex: 1; border: 0; border-radius: 10px; padding: 11px 0; font-size: 15px; font-weight: 800; cursor: pointer; }
  .qb.call { background: rgba(46,204,113,.16); color: var(--green); }
  .qb.put { background: rgba(255,92,92,.16); color: var(--red); }
  .qb.hold { background: rgba(79,216,255,.16); color: var(--blue); }
  .qb:disabled { opacity: .4; }
  .tmr { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .tmr .chip { padding: 4px 10px; }
  .sellbtn { margin-top: 10px; width: 100%; border: 1px solid rgba(255,92,92,.5); background: rgba(255,92,92,.1); color: var(--red);
    border-radius: 10px; padding: 9px; font-size: 14px; font-weight: 800; cursor: pointer; }
  .sellbtn.armed { background: var(--red); color: #fff; }
  .cd { font-size: 13px; font-weight: 700; color: var(--amber); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tag.you { background: rgba(245,185,66,.15); color: var(--amber); }
  .tag.swing { background: rgba(79,216,255,.15); color: var(--blue); }
  .step { display: flex; align-items: center; gap: 10px; }
  .step button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2);
    color: var(--text); font-size: 20px; font-weight: 700; cursor: pointer; }
  .step b { min-width: 24px; text-align: center; font-size: 18px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 8; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-width: 560px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); }
  .sheet .big { font-size: 19px; }
  .sheet .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .sheet .kv:last-of-type { border-bottom: 0; }
  .sheet .btns { display: flex; gap: 10px; margin-top: 16px; }
  .sheet .btns .btn { margin-top: 0; }
  .btn.green { background: var(--green); color: #06210f; }
  .btn.red { background: var(--red); }

  /* ===== STINKS: retro amber terminal theme ===== */
  :root { --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace; }
  html, body { font-family: var(--mono); font-size: 14px; }
  button, input { font-family: inherit; }
  body { background: radial-gradient(130% 70% at 50% 0%, #15110a 0%, var(--bg) 62%) fixed; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 30;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo { width: 24px; height: 24px; color: var(--amber); flex: none; filter: drop-shadow(0 0 4px rgba(255,176,0,.5)); }
  .wm { color: var(--amber); font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 10px rgba(255,176,0,.45); }
  .wm-sub { color: var(--muted); font-size: 11px; letter-spacing: 2px; font-weight: 600; }
  .pill { background: transparent; border: 1px solid var(--line); border-radius: 2px; letter-spacing: .5px; }
  .hero .label { letter-spacing: 1px; }
  .hero .equity { color: var(--amber); text-shadow: 0 0 14px rgba(255,176,0,.35); }
  h2 { color: var(--amber); font-size: 12px; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: "//"; color: var(--muted); }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .card { position: relative; border-radius: 2px;
    background: linear-gradient(180deg, rgba(255,176,0,.04), transparent 45%), var(--card); }
  .card::before, .card::after { content: ""; position: absolute; width: 9px; height: 9px; pointer-events: none; }
  .card::before { top: -1px; left: -1px; border-top: 2px solid var(--amber); border-left: 2px solid var(--amber); }
  .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--amber); border-right: 2px solid var(--amber); }
  .tag, .st, .side, .c, .chip, .btn, .qb, .sellbtn, .banner, .toast, .sheet, .step button,
  .addrow input, .addrow button, form.setup input { border-radius: 2px; }
  .sheet { border-radius: 4px 4px 0 0; border-top: 2px solid var(--amber); }
  .tag.open, .tag.swing { background: rgba(79,216,255,.13); }
  .btn { background: var(--amber); color: #140d00; letter-spacing: 1px; }
  .btn.ghost { background: transparent; color: var(--amber); border: 1px solid var(--line); }
  .btn.green { background: var(--green); color: #031a0b; }
  .chip.on { background: var(--amber); color: #140d00; border-color: var(--amber); }
  .addrow button { background: var(--amber); color: #140d00; }
  .toast { background: var(--amber); color: #140d00; box-shadow: 0 0 22px rgba(255,176,0,.35); }
  .icon-btn { color: var(--amber); }
  .tabbar { border-top: 1px solid var(--line); }
  .tabbar button { position: relative; letter-spacing: 2px; text-transform: uppercase; font-size: 11px; }
  .tabbar button .ti svg { display: block; width: 22px; height: 22px; margin: 0 auto 3px; }
  .tabbar button.on { color: var(--amber); }
  .tabbar button.on::before { content: ""; position: absolute; top: -1px; left: 32%; right: 32%; height: 2px;
    background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .q .rng i { border-radius: 1px; }
  .sub { font-size: 12px; }
  .levels { font-size: 11px; }
  .row.sub > div:last-child { white-space: nowrap; }
  .mlab { flex-wrap: wrap; gap: 2px 10px; font-size: 11px; }
  .mlab span { white-space: nowrap; }
  .mlab span:last-child { margin-left: auto; }

  /* ===== journal ===== */
  .kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .kpis .card { margin: 0; padding: 9px 10px; }
  .kpis .k { color: var(--muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .kpis .v { font-size: 16px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .jt { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .jt th { color: var(--muted); font-weight: 600; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    text-align: right; padding: 0 4px 6px; }
  .jt th:first-child, .jt td:first-child { text-align: left; padding-left: 0; }
  .jt td { text-align: right; padding: 7px 4px; border-top: 1px solid var(--line); white-space: nowrap; }
  .hbar { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; }
  .hbar .h { width: 54px; color: var(--muted); flex: none; }
  .hbar .bar { flex: 1; height: 8px; background: var(--card2); position: relative; }
  .hbar .bar i { position: absolute; top: 0; bottom: 0; }
  .hbar .t { width: 92px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .jtrade { padding: 9px 0; border-top: 1px solid var(--line); }
  .jtrade:first-child { border-top: 0; }
  .note-in { width: 100%; margin-top: 6px; background: var(--card2); border: 1px solid var(--line); color: var(--text);
    border-radius: 2px; padding: 7px 8px; font-size: 16px; }
  .mynote { color: var(--amber); font-size: 12px; margin-top: 4px; }
  .linkbtn { white-space: nowrap; margin-left: 8px; background: none; border: 0; color: var(--muted); font-size: 11px; padding: 0; text-decoration: underline; cursor: pointer; }
  .ok { color: var(--green); } .warn { color: var(--amber); }

  /* ===== startup screen ===== */
  #boot { position: fixed; inset: 0; z-index: 40; background: radial-gradient(90% 60% at 50% 40%, #1a140a 0%, #050505 70%);
    display: flex; align-items: center; justify-content: center; padding: 24px; color: var(--amber);
    font-family: var(--mono); transition: opacity .35s ease; cursor: pointer; }
  #boot.done { opacity: 0; pointer-events: none; }
  .noboot #boot { display: none; }
  .boot-in { width: 100%; max-width: 380px; }
  .boot-logo { width: 74px; height: 74px; display: block; margin: 0 auto 14px; color: var(--amber);
    filter: drop-shadow(0 0 10px rgba(255,176,0,.6)); }
  .boot-wm { text-align: center; font-size: 40px; font-weight: 800; letter-spacing: 12px; padding-left: 12px;
    text-shadow: 0 0 18px rgba(255,176,0,.55); animation: flick 2.4s steps(1) 1; }
  .boot-tag { text-align: center; color: var(--muted); font-size: 10px; letter-spacing: 2.2px; margin: 6px 0 22px; }
  #boot-log { margin: 0; min-height: 132px; font: 12px/1.65 var(--mono); color: #ffcf73; white-space: pre-wrap; }
  #boot-log .ok { color: var(--green); }
  #boot-log .warn { color: var(--amber); }
  #boot-log .cur::after { content: "\2588"; animation: blink .8s steps(1) infinite; }
  .boot-bar { height: 4px; margin-top: 14px; background: #2a2313; overflow: hidden; }
  .boot-bar i { display: block; height: 100%; width: 0; background: var(--amber); box-shadow: 0 0 10px var(--amber);
    transition: width .25s linear; }
  .boot-skip { text-align: center; color: var(--muted); font-size: 10px; letter-spacing: 3px; margin-top: 16px; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes flick { 0% { opacity: .2; } 6% { opacity: 1; } 9% { opacity: .35; } 12% { opacity: 1; } 40% { opacity: .85; } 42% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .boot-wm, #boot-log .cur::after { animation: none; }
    #boot, .boot-bar i { transition: none; }
  }
</style>
</head>
<body>
<div id="boot" data-act="boot-skip" aria-label="Starting STINKS">
  <div class="boot-in">
    <svg class="boot-logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 9V2h7M23 2h7v7M30 23v7h-7M9 30H2v-7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 14v12M16 9v13M22 5v12" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="16" width="4" height="7" fill="currentColor"/><rect x="14" y="11" width="4" height="8" fill="currentColor"/><rect x="20" y="7" width="4" height="7" fill="currentColor"/></svg>
    <div class="boot-wm">STINKS</div>
    <div class="boot-tag">STOCK TRADING INTELLIGENCE KERNEL SYSTEM</div>
    <pre id="boot-log"></pre>
    <div class="boot-bar"><i></i></div>
    <div class="boot-skip">TAP TO SKIP</div>
  </div>
</div>
<div id="app"></div>
<div id="toast" class="toast"></div>
<nav class="tabbar" id="tabbar" style="display:none">

<script>
"use strict";
// ---------------- config ----------------
const TZ = "America/Chicago";                      // times are shown in Central
const API = "https://paper-api.alpaca.markets";    // paper only: this app can never touch real money
const DATA = "https://data.alpaca.markets";
const TRADE_WS = "wss://paper-api.alpaca.markets/stream";
const DATA_WS = "wss://stream.data.alpaca.markets/v2/iex";
const KEY_STORE = "paperbot_keys";
const MY_STORE = "paperbot_mylist";
const INDEXES = [["SPY", "S&P 500"], ["QQQ", "Nasdaq 100"], ["DIA", "Dow"], ["IWM", "Russell 2000"]];
// Same stocks the bot scans (bot.py WATCHLIST)
const BOT_WATCHLIST = ["BAC", "WFC", "C", "KEY", "SOFI", "NU", "HOOD", "PYPL", "AFRM", "T", "VZ", "CMCSA", "WBD", "NKE", "DKNG", "PFE", "INTC", "CSCO", "MRVL", "SMCI", "UBER", "SNAP", "JD", "SOUN", "IONQ", "RGTI", "F", "GM", "RIVN", "LCID", "NIO", "AAL", "DAL", "UAL", "CCL", "RKLB", "ACHR", "JOBY", "OXY", "DVN", "FCX", "NEM", "MARA", "RIOT", "CLSK", "IREN", "XLF", "SLV", "GDX", "IBIT", "KO", "DIS", "BMY", "MRK", "GILD", "KHC", "WMT", "TGT", "SBUX", "CMG", "CVS", "USB", "TFC", "SCHW", "ALLY", "LYFT", "PINS", "RBLX", "ROKU", "GME", "AMC", "HPE", "HPQ", "ON", "PLTR", "AMD", "LUV", "NCLH", "CLF", "AA", "VALE", "PBR", "KMI", "HAL", "SLB", "ET", "RIG", "APA", "KGC", "XLE", "EEM", "FXI", "KWEB", "TLT", "ARKK"];
// Same rules as bot.py, so the app and the bot agree
const OPT_UNDERLYINGS = ["SPY", "QQQ"];
const OPT_CHASE_PCT = 0.3;          // bot won't buy once SPY/QQQ is this far past its range
const OPT_BUDGET_PCT = 25;          // one contract, at most 25% of the account (~$125)
const SWING_BUDGET = 150;           // most in swing holds at once (the bot's and yours)
const SWING_STOP_PCT = 7;           // protective stop under your swing buys
const TIMERS = [[5, "5s"], [30, "30s"], [60, "1m"], [300, "5m"], [0, "Off"]];
const CRYPTO_BUDGET = 100;          // most in crypto at once (bot.py CRYPTO_BUDGET_DOLLARS)
const MT_STORE = "paperbot_mt";
const NOTE_STORE = "stinks_notes";
const JOURNAL_DAYS = 90;            // how far back the journal looks
const BOT_RISK_PCT = 2;             // what bot.py risks per stock trade (RISK_PER_TRADE_PCT)
const SETUPS = { orb: "Breakout", ict: "Sweep", "0dte": "0DTE (bot)", swing: "Swing (bot)", crypto: "Crypto", myopt: "Your options", myhold: "Your holds" };

// ---------------- state ----------------
let keys = loadKeys();
const S = {
  account: null, clock: null, positions: [], orders: [], fills: [], history: null,
  barsByDay: {}, barsFetched: {}, chartsBroken: false, day: null, days: [],
  tradeWs: "off", dataWs: "off", lastUpdate: null, error: null, showSettings: false, loading: false,
  tab: loadPref("paperbot_tab", "bot"), snaps: {}, mkBars: {}, mkFetched: {}, mkUpdate: null, mkError: null,
  mkLoading: false, sortBy: loadPref("paperbot_sort", "up"), expanded: null, myList: loadMyList(),
  timer: Number(loadPref("paperbot_timer", "30")), sheet: null, qtBusy: null, mt: loadMt(), optQ: {},
  armSell: null, swingBook: {}, swingSig: null, holdQty: 1,
  journal: null, jUpdate: null, jError: null, jLoading: false, jEdit: null, jShow: 15, notes: loadNotes(),
};
function loadNotes() { try { const n = JSON.parse(localStorage.getItem(NOTE_STORE) || "{}"); return n && typeof n === "object" ? n : {}; } catch (e) { return {}; } }
function saveNotes() { try { localStorage.setItem(NOTE_STORE, JSON.stringify(S.notes)); } catch (e) {} }
function loadMt() { try { const m = JSON.parse(localStorage.getItem(MT_STORE) || "null"); return m && m.sym ? m : null; } catch (e) { return null; } }
function saveMt() { try { S.mt ? localStorage.setItem(MT_STORE, JSON.stringify(S.mt)) : localStorage.removeItem(MT_STORE); } catch (e) {} }
function clearMt() { S.mt = null; saveMt(); }

function loadKeys() {
  try { const k = JSON.parse(localStorage.getItem(KEY_STORE) || "null"); return k && k.key && k.secret ? k : null; }
  catch (e) { return null; }
}
function saveKeys(k) { try { localStorage.setItem(KEY_STORE, JSON.stringify(k)); } catch (e) {} }
function forgetKeys() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }
function loadPref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function loadMyList() {
  try { const l = JSON.parse(localStorage.getItem(MY_STORE) || "[]"); return Array.isArray(l) ? l.slice(0, 30) : []; }
  catch (e) { return []; }
}
function saveMyList() { try { localStorage.setItem(MY_STORE, JSON.stringify(S.myList)); } catch (e) {} }

// ---------------- helpers ----------------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (x) => (x === null || x === undefined || x === "" ? NaN : Number(x));
const money = (x) => (x < 0 ? "-" : "") + "$" + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = (x) => (x >= 0 ? "+" : "-") + "$" + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (x) => (x >= 0 ? "+" : "") + x.toFixed(2) + "%";
const cls = (x) => (x > 0.0049 ? "pos" : x < -0.0049 ? "neg" : "muted");
const px = (x) => (Math.abs(x) >= 1000 ? x.toFixed(0) : x.toFixed(2));
// Same-day options use OCC symbols like SPY251113C00602000; each contract covers 100 shares
const isOption = (sym) => sym.length > 15 && /[CP]\d{8}$/.test(sym);
const optLabel = (sym) => `${sym.slice(0, -15)} ${+sym.slice(-8) / 1000} ${sym.at(-9) === "C" ? "call" : "put"}`;
// Crypto the bot trades (bot.py CRYPTO_SYMBOLS). Positions come back as "BTCUSD", orders as "BTC/USD".
const CRYPTO_COINS = ["BTC", "ETH", "SOL", "LTC", "AVAX", "LINK"];
const isCrypto = (sym) => sym.includes("/") || CRYPTO_COINS.some((c) => sym === c + "USD");
const coinOf = (sym) => sym.replace("/", "").replace(/USD$/, "");
const nameOf = (sym) => (isOption(sym) ? optLabel(sym) : isCrypto(sym) ? coinOf(sym) : sym);
const mult = (sym) => (isOption(sym) ? 100 : 1);
const clockTime = (t) => new Date(t).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" });

function zoneParts(date, tz) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short" });
  const o = {};
  for (const p of f.formatToParts(date)) o[p.type] = p.value;
  return o;
}
function etDate(t) { const p = zoneParts(new Date(t), "America/New_York"); return `${p.year}-${p.month}-${p.day}`; }
// Wall-clock time in New York on a date -> real instant
function etInstant(dateStr, h, m) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  let guess = Date.UTC(y, mo - 1, d, h, m);
  for (let i = 0; i < 2; i++) {
    const p = zoneParts(new Date(guess), "America/New_York");
    const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
    guess += Date.UTC(y, mo - 1, d, h, m) - asUtc;
  }
  return new Date(guess);
}
function dayLabel(dateStr) {
  const today = etDate(Date.now());
  if (dateStr === today) return "Today";
  const d = etInstant(dateStr, 12, 0);
  return d.toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short", month: "numeric", day: "numeric" });
}

class AuthError extends Error {}
async function api(path, base = API) {
  let r;
  try {
    r = await fetch(base + path, { headers: { "APCA-API-KEY-ID": keys.key, "APCA-API-SECRET-KEY": keys.secret } });
  } catch (e) {
    const err = new Error("network"); err.network = true; throw err;
  }
  if (r.status === 401 || r.status === 403) throw new AuthError("Alpaca rejected these keys");
  if (!r.ok) throw new Error(`Alpaca error ${r.status}: ${(await r.text()).slice(0, 140)}`);
  return r.json();
}
// Orders and sells. Always the paper API, never anything else.
async function apiSend(method, path, body) {
  let r;
  const headers = { "APCA-API-KEY-ID": keys.key, "APCA-API-SECRET-KEY": keys.secret };
  if (body) headers["Content-Type"] = "application/json";
  try { r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { const err = new Error("Can't reach Alpaca. Check your connection."); err.network = true; throw err; }
  const text = await r.text();
  let j = null; try { j = text ? JSON.parse(text) : null; } catch (e) {}
  if (!r.ok) { const err = new Error((j && j.message) || `Alpaca error ${r.status}`); err.status = r.status; throw err; }
  return j;
}

// ---------------- loading ----------------
async function loadAll() {
  if (!keys || S.loading) return;
  S.loading = true;
  try {
    const after = new Date(Date.now() - 9 * 864e5).toISOString();
    const [account, clock, positions, orders, fills, history] = await Promise.all([
      api("/v2/account"),
      api("/v2/clock"),
      api("/v2/positions"),
      api(`/v2/orders?status=all&after=${encodeURIComponent(after)}&limit=500&direction=desc&nested=true`),
      api(`/v2/account/activities/FILL?after=${encodeURIComponent(after)}&direction=desc&page_size=100`),
      api("/v2/account/portfolio/history?period=1D&timeframe=5Min").catch(() => null),
    ]);
    Object.assign(S, { account, clock, positions, orders, fills, history, error: null, lastUpdate: Date.now() });
    await loadSwingBook().catch(() => {});
    const today = etDate(clock.timestamp);
    const days = [...new Set(fills.map((f) => etDate(f.transaction_time)))];
    if (clock.is_open || !days.length || positions.length) days.push(today);
    S.days = [...new Set(days)].sort().reverse().slice(0, 7);
    if (!S.day || !S.days.includes(S.day)) S.day = S.days[0];
    await loadBars(today);
    if (S.day !== today) await loadBars(S.day);
  } catch (e) {
    if (e instanceof AuthError) { S.error = "Alpaca rejected your keys. Check them in settings (⚙)."; }
    else if (e.network) { S.error = "Can't reach Alpaca right now. Retrying…"; }
    else { S.error = e.message; }
  } finally {
    S.loading = false;
    render();
    syncStreams();
  }
}

// Which stocks are swing holds, from how they were bought ("swing-" = bot, "app-swing-" = you)
async function loadSwingBook() {
  const stocks = S.positions.filter((p) => !isOption(p.symbol) && !isCrypto(p.symbol));
  const sig = stocks.map((p) => p.symbol + ":" + p.qty).sort().join(",");
  if (sig === S.swingSig) return;
  const book = {};
  if (stocks.length) {
    const after = new Date(Date.now() - 60 * 864e5).toISOString();
    const orders = await api(`/v2/orders?status=all&symbols=${stocks.map((p) => encodeURIComponent(p.symbol)).join(",")}` +
      `&after=${encodeURIComponent(after)}&limit=500&direction=desc&nested=true`);
    for (const p of stocks) {
      const buys = orders.filter((o) => o.symbol === p.symbol && o.side === "buy" && o.filled_at)
        .sort((a, b) => b.filled_at.localeCompare(a.filled_at));
      const o = buys[0], tag = (o && o.client_order_id) || "";
      if (tag.startsWith("app-swing-")) book[p.symbol] = { who: "you", at: o.filled_at, legs: o.legs || [] };
      else if (tag.startsWith("swing-")) book[p.symbol] = { who: "bot", at: o.filled_at, legs: o.legs || [] };
    }
  }
  S.swingBook = book; S.swingSig = sig;
}
const isSwing = (sym) => !!S.swingBook[sym];
function swingInUse() {
  return S.positions.filter((p) => isSwing(p.symbol)).reduce((s, p) => s + num(p.qty) * num(p.current_price), 0);
}
// Trading days held: weekdays after the buy day, up to today
function daysHeld(iso) {
  let n = 0;
  const d = new Date(etInstant(etDate(iso), 12, 0)), end = etDate(Date.now());
  for (let i = 0; i < 60; i++) {
    d.setUTCDate(d.getUTCDate() + 1);
    if (etDate(d) > end) break;
    const wd = zoneParts(d, "America/New_York").weekday;
    if (wd !== "Sat" && wd !== "Sun") n++;
  }
  return n;
}
const boughtInApp = (sym) => S.orders.some((o) => o.symbol === sym && o.side === "buy" && (o.client_order_id || "").startsWith("app-"));

function symbolsForDay(day) {
  const set = new Set(tripsFor(day).map((t) => t.symbol));
  if (day === etDate(Date.now())) S.positions.forEach((p) => set.add(p.symbol));
  return [...set].filter((sym) => !isOption(sym) && !isCrypto(sym)).sort();
}

async function loadBars(day) {
  const syms = symbolsForDay(day);
  if (!syms.length || S.chartsBroken) return;
  const isToday = day === etDate(Date.now());
  const key = day + "|" + syms.join(",");
  const last = S.barsFetched[key];
  if (last && (!isToday || Date.now() - last < 45000)) return; // past days never change
  try {
    const out = await fetchBars(day, syms);
    // keep live-built candles that are newer than what the API returned
    const prev = S.barsByDay[day] || {};
    for (const [sym, arr] of Object.entries(prev)) {
      const lastBar = (out[sym] || []).at(-1);
      const newer = arr.filter((b) => !lastBar || new Date(b.t) > new Date(lastBar.t));
      if (newer.length) (out[sym] = out[sym] || []).push(...newer);
    }
    S.barsByDay[day] = out;
    S.barsFetched[key] = Date.now();
  } catch (e) {
    if (e.network) S.chartsBroken = true;
  }
}

async function fetchBars(day, syms) {
  const start = etInstant(day, 9, 30).toISOString();
  const end = new Date(Math.min(etInstant(day, 16, 0).getTime(), Date.now())).toISOString();
  const out = {};
  let token = "";
  for (let i = 0; i < 5; i++) {
    const q = `/v2/stocks/bars?symbols=${syms.join(",")}&timeframe=5Min&start=${encodeURIComponent(start)}` +
      `&end=${encodeURIComponent(end)}&feed=iex&limit=10000&adjustment=raw` + (token ? `&page_token=${token}` : "");
    const res = await api(q, DATA);
    for (const [sym, arr] of Object.entries(res.bars || {})) (out[sym] = out[sym] || []).push(...arr);
    token = res.next_page_token;
    if (!token) break;
  }
  return out;
}

// ---------------- market ----------------
async function loadMarket() {
  if (!keys || S.mkLoading) return;
  S.mkLoading = true;
  try {
    const syms = [...new Set([...INDEXES.map((i) => i[0]), ...S.myList, ...BOT_WATCHLIST])];
    const snaps = {};
    for (let i = 0; i < syms.length; i += 100) {
      const part = syms.slice(i, i + 100).map(encodeURIComponent).join(",");
      Object.assign(snaps, await api(`/v2/stocks/snapshots?symbols=${part}&feed=iex`, DATA));
    }
    S.snaps = snaps; S.mkUpdate = Date.now(); S.mkError = null;
    const need = INDEXES.map((i) => i[0]);
    if (S.expanded) need.push(S.expanded);
    await loadMktBars(sessionDay(), need);
  } catch (e) {
    S.mkError = e instanceof AuthError ? "Alpaca rejected your keys. Check them in settings (\u2699)."
      : e.network ? "Can't reach market data right now. Retrying\u2026" : e.message;
  } finally {
    S.mkLoading = false;
    render();
  }
}

function sessionDay() {
  const spy = S.snaps.SPY;
  const t = spy && spy.dailyBar && spy.dailyBar.t;
  return t ? etDate(t) : etDate(Date.now());
}

async function loadMktBars(day, syms) {
  const isToday = day === etDate(Date.now());
  const want = syms.filter((sym) => {
    const t = S.mkFetched[day + "|" + sym];
    return !t || (isToday && Date.now() - t > 60000);
  });
  if (!want.length) return;
  try {
    const res = await fetchBars(day, want);
    const store = (S.mkBars[day] = S.mkBars[day] || {});
    for (const sym of want) { store[sym] = res[sym] || []; S.mkFetched[day + "|" + sym] = Date.now(); }
  } catch (e) { /* charts just stay empty */ }
}

function quote(sym) {
  const sn = S.snaps[sym];
  if (!sn) return null;
  const db = sn.dailyBar || {};
  const price = isFinite(num(sn.latestTrade && sn.latestTrade.p)) ? num(sn.latestTrade.p) : num(db.c);
  const prev = num(sn.prevDailyBar && sn.prevDailyBar.c);
  if (!isFinite(price)) return null;
  return { sym, price, prev, chg: prev ? ((price - prev) / prev) * 100 : NaN, lo: num(db.l), hi: num(db.h), open: num(db.o) };
}

// ---------------- trades ----------------
function tripsFor(day) {
  const fills = S.fills.filter((f) => etDate(f.transaction_time) === day)
    .sort((a, b) => a.transaction_time.localeCompare(b.transaction_time));
  const bySym = {};
  for (const f of fills) {
    const t = (bySym[f.symbol] = bySym[f.symbol] || { symbol: f.symbol, bq: 0, bc: 0, sq: 0, sp: 0, buys: [], sells: [], first: f.transaction_time, last: f.transaction_time });
    const q = num(f.qty), p = num(f.price);
    if (f.side === "buy") { t.bq += q; t.bc += q * p; t.buys.push(f); }
    else { t.sq += q; t.sp += q * p; t.sells.push(f); }
    t.last = f.transaction_time;
  }
  const parents = S.orders.filter((o) => o.side === "buy" && o.order_class === "bracket" && etDate(o.created_at) === day);
  return Object.values(bySym).map((t) => {
    t.avgBuy = t.bq ? t.bc / t.bq : NaN;
    t.avgSell = t.sq ? t.sp / t.sq : NaN;
    t.open = t.sq < t.bq - 1e-9;
    t.pnl = t.sq && t.bq ? (t.sp - t.avgBuy * t.sq) * mult(t.symbol) : 0;
    const parent = parents.find((o) => o.symbol === t.symbol);
    t.sweep = !!parent && (parent.client_order_id || "").startsWith("ict-"); // bought on the liquidity-sweep setup
    const legs = (parent && parent.legs) || [];
    const tp = legs.find((l) => l.type === "limit");
    const sl = legs.find((l) => l.type === "stop" || l.type === "stop_limit");
    t.target = tp ? num(tp.limit_price) : NaN;
    t.stop = sl ? num(sl.stop_price) : NaN;
    t.reason = t.open ? "Open" : tp && tp.status === "filled" ? "Target hit" : sl && sl.status === "filled" ? "Stopped out" : "Sold by bot";
    return t;
  }).sort((a, b) => b.first.localeCompare(a.first));
}

// ---------------- charts ----------------
function chart({ symbol, day, lines = [], markers = [], live = NaN, bars: given }) {
  const bars = given || ((S.barsByDay[day] || {})[symbol]) || [];
  const W = 340, H = 170, L = 6, R = 50, T = 8, B = 20;
  const pw = W - L - R, ph = H - T - B;
  if (!bars.length) {
    const msg = S.chartsBroken ? "Charts unavailable (data feed blocked)" : "Chart fills in as trading happens";
    return `<svg viewBox="0 0 ${W} 60"><text x="${W / 2}" y="34" fill="#a38d63" font-size="12" text-anchor="middle">${msg}</text></svg>`;
  }
  const t0 = etInstant(day, 9, 30).getTime(), t1 = etInstant(day, 16, 0).getTime();
  let lo = Infinity, hi = -Infinity;
  for (const b of bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); }
  for (const l of lines) if (isFinite(l.price)) { lo = Math.min(lo, l.price); hi = Math.max(hi, l.price); }
  for (const m of markers) if (isFinite(m.price)) { lo = Math.min(lo, m.price); hi = Math.max(hi, m.price); }
  if (isFinite(live)) { lo = Math.min(lo, live); hi = Math.max(hi, live); }
  const padY = (hi - lo) * 0.08 || hi * 0.002 || 1;
  lo -= padY; hi += padY;
  const x = (t) => L + ((new Date(t).getTime() - t0) / (t1 - t0)) * pw;
  const y = (p) => T + (1 - (p - lo) / (hi - lo)) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" font-family="-apple-system,Segoe UI,Roboto,sans-serif">`;
  s += `<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="#0a0907" rx="6"/>`;
  // horizontal grid + price labels (skip labels hidden behind a level tag)
  const tagYs = lines.filter((l) => isFinite(l.price)).map((l) => y(l.price));
  for (let i = 0; i <= 4; i++) {
    const p = lo + ((hi - lo) * i) / 4, yy = y(p).toFixed(1);
    s += `<line x1="${L}" x2="${L + pw}" y1="${yy}" y2="${yy}" stroke="#2a2313" stroke-width="1"/>`;
    if (!tagYs.some((ty) => Math.abs(ty - yy) < 15))
      s += `<text x="${L + pw + 4}" y="${+yy + 4}" fill="#8a7650" font-size="10">${px(p)}</text>`;
  }
  // vertical grid each hour (labels in Central)
  for (let h = 10; h <= 15; h++) {
    const t = etInstant(day, h, 0).getTime(), xx = x(t).toFixed(1);
    s += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T + ph}" stroke="#2a2313" stroke-width="1"/>`;
    const lbl = new Date(t).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric" }).replace(" ", "").toLowerCase();
    s += `<text x="${xx}" y="${H - 6}" fill="#8a7650" font-size="10" text-anchor="middle">${lbl}</text>`;
  }
  // candles
  const cw = Math.max(1.5, (pw / 78) * 0.68);
  for (const b of bars) {
    const xc = x(new Date(b.t).getTime() + 150000), up = b.c >= b.o, col = up ? "#5fe08a" : "#ff5c4d";
    const yo = y(b.o), yc = y(b.c), top = Math.min(yo, yc), hgt = Math.max(1, Math.abs(yc - yo));
    s += `<line x1="${xc.toFixed(1)}" x2="${xc.toFixed(1)}" y1="${y(b.h).toFixed(1)}" y2="${y(b.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
    s += `<rect x="${(xc - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${col}"/>`;
  }
  // level lines (entry / stop / target)
  for (const l of lines) {
    if (!isFinite(l.price)) continue;
    const yy = y(l.price).toFixed(1);
    s += `<line x1="${L}" x2="${L + pw}" y1="${yy}" y2="${yy}" stroke="${l.color}" stroke-width="1.2" stroke-dasharray="5 4"/>`;
    s += `<rect x="${L + pw + 1}" y="${+yy - 8}" width="${R - 2}" height="16" rx="4" fill="${l.color}"/>`;
    s += `<text x="${L + pw + R / 2}" y="${+yy + 4}" fill="#060708" font-size="10" font-weight="700" text-anchor="middle">${px(l.price)}</text>`;
  }
  // buy / sell markers
  for (const m of markers) {
    if (!isFinite(m.price)) continue;
    const xx = x(m.t), yy = y(m.price);
    const pts = m.side === "buy"
      ? `${xx},${yy + 3} ${xx - 6},${yy + 13} ${xx + 6},${yy + 13}`
      : `${xx},${yy - 3} ${xx - 6},${yy - 13} ${xx + 6},${yy - 13}`;
    s += `<polygon points="${pts}" fill="${m.side === "buy" ? "#5fe08a" : "#ff5c4d"}" stroke="#060708" stroke-width="1"/>`;
  }
  // live price dot
  if (isFinite(live) && day === etDate(Date.now())) {
    const lastT = new Date(bars.at(-1).t).getTime() + 150000;
    s += `<circle cx="${x(lastT).toFixed(1)}" cy="${y(live).toFixed(1)}" r="3.5" fill="#ffd27a"/>`;
  }
  return s + "</svg>";
}

function sparkline(hist) {
  if (!hist || !hist.equity) return "";
  const pts = hist.timestamp.map((t, i) => [t, hist.equity[i]]).filter((p) => p[1] !== null && p[1] > 0);
  if (pts.length < 2) return "";
  const W = 340, H = 46, base = num(hist.base_value) || pts[0][1];
  let lo = Math.min(base, ...pts.map((p) => p[1])), hi = Math.max(base, ...pts.map((p) => p[1]));
  if (hi - lo < 0.01) { hi += 0.5; lo -= 0.5; }
  const x = (i) => (i / (pts.length - 1)) * W, y = (v) => 3 + (1 - (v - lo) / (hi - lo)) * (H - 6);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const col = pts.at(-1)[1] >= base ? "#5fe08a" : "#ff5c4d";
  return `<svg viewBox="0 0 ${W} ${H}" class="spark"><line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="#3b3016" stroke-dasharray="3 4"/>` +
    `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

// ---------------- rendering ----------------
let renderQueued = false, pointerDown = false;
// Don't redraw under a finger mid-tap, or the tap can get lost (the screen redraws every second during a trade)
document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, () => { pointerDown = false; }, true);
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    if (pointerDown) { setTimeout(render, 100); return; }
    draw();
  });
}

function statusPill() {
  if (!S.clock) return `<span class="pill"><span class="dot"></span>Connecting…</span>`;
  if (!S.clock.is_open) {
    const nxt = new Date(S.clock.next_open);
    const when = nxt.toLocaleString("en-US", { timeZone: TZ, weekday: "short", hour: "numeric", minute: "2-digit" });
    return `<span class="pill"><span class="dot"></span>Closed · opens ${esc(when)}</span>`;
  }
  if (S.tradeWs === "live") return `<span class="pill live"><span class="dot"></span>Live</span>`;
  return `<span class="pill warn"><span class="dot"></span>Updating every 15s</span>`;
}

function draw() {
  const app = $("#app"), bar = $("#tabbar");
  // keep whatever the user is typing (and the cursor) through re-renders
  const ae = document.activeElement;
  const keep = ae && ae.id && ae.tagName === "INPUT" ? { id: ae.id, v: ae.value, p: ae.selectionStart } : null;
  if (!keys) { bar.style.display = "none"; app.innerHTML = setupView(); }
  else {
    bar.style.display = "flex";
    for (const b of bar.querySelectorAll("button")) b.classList.toggle("on", b.dataset.tab === S.tab);
    let h = `<div class="top">${brand(S.tab === "market" ? "MARKET" : S.tab === "journal" ? "JOURNAL" : "BOT")}<div>${statusPill()}<button class="icon-btn" data-act="settings" aria-label="Settings">\u2699</button></div></div>`;
    if (S.showSettings) h += settingsView();
    if (S.error && S.tab === "bot") h += `<div class="banner err">${esc(S.error)}</div>`;
    h += S.tab === "market" ? marketView() : S.tab === "journal" ? journalView() : botView();
    if (S.sheet) h += sheetView();
    app.innerHTML = h;
  }
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.p, keep.p); } catch (e) {} }
  }
}

function botView() {
  const a = S.account;
  let h = "";
  if (!a) return h + `<div class="empty">Loading your paper account…</div>`;

  const equity = num(a.equity), last = num(a.last_equity), dayPnl = equity - last;
  h += `<div class="hero"><div class="label">Paper account</div><div class="equity">${money(equity)}</div>` +
    `<div class="pnl ${cls(dayPnl)}">${signed(dayPnl)} (${pct(last ? (dayPnl / last) * 100 : 0)}) today</div>` +
    sparkline(S.history) +
    `<div class="meta">Updated ${S.lastUpdate ? clockTime(S.lastUpdate) : "—"} · times in Central</div></div>`;

  // open positions (day trades and same-day options; swing holds get their own list)
  const today = etDate(Date.now());
  const tripsToday = tripsFor(today);
  const dayPos = S.positions.filter((p) => !isSwing(p.symbol) && !isCrypto(p.symbol));
  const cryptoPos = S.positions.filter((p) => isCrypto(p.symbol));
  const swingPos = S.positions.filter((p) => isSwing(p.symbol));
  h += `<h2>Open positions (${dayPos.length})</h2>`;
  if (!dayPos.length) {
    h += `<div class="card empty">No open day trades. The bot looks for trades from 8:45 AM to 2:40 PM.</div>`;
  }
  for (const p of dayPos) {
    const t = tripsToday.find((x) => x.symbol === p.symbol) || {};
    const qty = num(p.qty), entry = num(p.avg_entry_price), now = num(p.current_price);
    const upl = (now - entry) * qty * mult(p.symbol), uplPct = entry ? ((now - entry) / entry) * 100 : 0;
    if (isOption(p.symbol)) { h += optionCard(p); continue; }
    h += `<div class="card"><div class="row"><div><span class="sym">${esc(p.symbol)}</span><span class="tag open">OPEN</span>${t.sweep ? `<span class="tag flat">SWEEP</span>` : ""}</div>` +
      `<div class="big ${cls(upl)}">${signed(upl)}</div></div>` +
      `<div class="row sub"><div>${qty} sh @ ${entry.toFixed(2)} → <b style="color:var(--text)">${now.toFixed(2)}</b></div><div class="${cls(upl)}">${pct(uplPct)}</div></div>` +
      `<div class="levels"><span>Entry <b>${entry.toFixed(2)}</b></span>` +
      (isFinite(t.stop) ? `<span>Stop <b style="color:var(--red)">${t.stop.toFixed(2)}</b></span>` : "") +
      (isFinite(t.target) ? `<span>Target <b style="color:var(--green)">${t.target.toFixed(2)}</b></span>` : "") + `</div>` +
      `<div class="chart">${chart({ symbol: p.symbol, day: today, live: now,
        lines: [{ price: t.target, color: "#5fe08a" }, { price: entry, color: "#4fd8ff" }, { price: t.stop, color: "#ff5c4d" }],
        markers: (t.buys || []).map((f) => ({ t: f.transaction_time, price: num(f.price), side: "buy" })) })}</div></div>`;
  }

  // swing holds (kept overnight)
  const used = swingInUse();
  h += `<h2>Swing holds (${swingPos.length})</h2>`;
  h += `<div class="sub" style="margin:-2px 2px 8px">${money(used)} of ${money(SWING_BUDGET)} swing money in use</div>`;
  if (!swingPos.length) {
    h += `<div class="card empty">Nothing held overnight. The bot looks for pullbacks in uptrending stocks from 9:00 AM, and you can buy to hold from any stock's chart on the Market tab.</div>`;
  }
  for (const p of swingPos) h += swingCard(p);

  // crypto (trades day and night)
  h += `<h2>Crypto (${cryptoPos.length})</h2>`;
  h += `<div class="sub" style="margin:-2px 2px 8px">${money(cryptoPos.reduce((a, p) => a + num(p.qty) * num(p.current_price), 0))} of ${money(CRYPTO_BUDGET)} crypto money in use \u00b7 open 24/7</div>`;
  if (!cryptoPos.length) {
    h += `<div class="card empty">No crypto held. The bot checks ${CRYPTO_COINS.join(", ")} around the clock for a dip in an uptrend.</div>`;
  }
  for (const p of cryptoPos) h += cryptoCard(p);

  // trades by day
  h += `<h2>Trades</h2><div class="chips">` +
    S.days.map((d) => `<button class="chip ${d === S.day ? "on" : ""}" data-act="day" data-day="${d}">${esc(dayLabel(d))}</button>`).join("") + `</div>`;
  const trips = tripsFor(S.day).filter((t) => (!t.open || S.day !== today) && !isCrypto(t.symbol)); // crypto trades are in the Journal
  if (!trips.length) {
    h += `<div class="card empty">${S.day === today ? "No finished trades yet today." : "No trades this day."}</div>`;
  } else {
    const total = trips.reduce((s, t) => s + t.pnl, 0);
    const wins = trips.filter((t) => t.pnl > 0.0049).length;
    h += `<div class="sub" style="margin:2px 2px 8px">${trips.length} trade${trips.length > 1 ? "s" : ""} · ${wins} win${wins === 1 ? "" : "s"} · <span class="${cls(total)}">${signed(total)}</span></div>`;
  }
  for (const t of trips) {
    const tag = t.open ? "open" : t.pnl > 0.0049 ? "win" : t.pnl < -0.0049 ? "loss" : "flat";
    if (isOption(t.symbol)) {
      h += `<div class="card"><div class="row"><div><span class="sym">${esc(optLabel(t.symbol))}</span><span class="tag ${tag}">SAME-DAY</span>${boughtInApp(t.symbol) ? `<span class="tag you">YOURS</span>` : ""}</div>` +
        `<div class="big ${cls(t.pnl)}">${t.open ? "\u2014" : signed(t.pnl)}</div></div>` +
        `<div class="row sub"><div>${t.bq} contract${t.bq === 1 ? "" : "s"} \u00b7 in ${t.avgBuy.toFixed(2)} \u00b7 out ${isFinite(t.avgSell) ? t.avgSell.toFixed(2) : "\u2014"}</div>` +
        `<div>${clockTime(t.first)}\u2013${clockTime(t.last)}</div></div></div>`;
      continue;
    }
    h += `<div class="card"><div class="row"><div><span class="sym">${esc(t.symbol)}</span><span class="tag ${tag}">${esc(t.reason.toUpperCase())}</span>${t.sweep ? `<span class="tag flat">SWEEP</span>` : ""}</div>` +
      `<div class="big ${cls(t.pnl)}">${t.open ? "—" : signed(t.pnl)}</div></div>` +
      `<div class="row sub"><div>${t.bq} sh · in ${isFinite(t.avgBuy) ? t.avgBuy.toFixed(2) : "—"} · out ${isFinite(t.avgSell) ? t.avgSell.toFixed(2) : "—"}</div>` +
      `<div>${clockTime(t.first)}–${clockTime(t.last)}</div></div>` +
      `<div class="chart">${chart({ symbol: t.symbol, day: S.day,
        lines: [{ price: t.target, color: "#5fe08a" }, { price: t.avgBuy, color: "#4fd8ff" }, { price: t.stop, color: "#ff5c4d" }],
        markers: [...t.buys.map((f) => ({ t: f.transaction_time, price: num(f.price), side: "buy" })),
                  ...t.sells.map((f) => ({ t: f.transaction_time, price: num(f.price), side: "sell" }))] })}</div></div>`;
  }

  // raw fill feed for the day
  const dayFills = S.fills.filter((f) => etDate(f.transaction_time) === S.day);
  if (dayFills.length) {
    h += `<h2>Activity</h2><div class="card feed">` + dayFills.slice(0, 40).map((f) =>
      `<div class="item"><span class="side ${f.side === "buy" ? "buy" : "sell"}">${f.side === "buy" ? "BUY" : "SELL"}</span>` +
      `<span><b>${esc(nameOf(f.symbol))}</b> ${num(f.qty)} @ ${num(f.price).toFixed(2)}</span><span class="time">${clockTime(f.transaction_time)}</span></div>`).join("") + `</div>`;
  }
  if (S.chartsBroken) h += `<div class="banner">Price charts couldn't load from Alpaca's data feed. Trades and P&L still update.</div>`;
  h += `<div class="note" style="text-align:center;margin-top:18px">Your Alpaca paper account (practice money). Trade options or buy to hold from the Market tab.</div>`;
  return h;
}

function sellButton(sym, label) {
  const armed = S.armSell && S.armSell.sym === sym && Date.now() < S.armSell.until;
  return `<button class="sellbtn ${armed ? "armed" : ""}" data-act="sell" data-sym="${esc(sym)}">${armed ? "Tap again to sell" : esc(label)}</button>`;
}

function mtLine(sym) {
  const m = S.mt;
  if (!m || m.sym !== sym) return "";
  if (m.state === "pending") return `<div class="cd">Buying…</div>`;
  if (m.sellAt) {
    const s = Math.max(0, Math.ceil((m.sellAt - Date.now()) / 1000));
    return `<div class="cd">Auto-sell in ${s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : s + "s"}</div>`;
  }
  return `<div class="cd" style="color:var(--muted)">No timer · sell when you want</div>`;
}

// A same-day option you or the bot hold
function optionCard(p) {
  const qty = num(p.qty), entry = num(p.avg_entry_price);
  const q = S.optQ[p.symbol];
  const bid = q && Date.now() - q.at < 15000 && num(q.bp) > 0 ? num(q.bp) : NaN;
  const now = isFinite(bid) ? bid : num(p.current_price);
  const upl = (now - entry) * qty * 100, uplPct = entry ? ((now - entry) / entry) * 100 : 0;
  const mine = boughtInApp(p.symbol);
  return `<div class="card"><div class="row"><div><span class="sym">${esc(optLabel(p.symbol))}</span><span class="tag open">SAME-DAY</span>${mine ? `<span class="tag you">YOURS</span>` : ""}</div>` +
    `<div class="big ${cls(upl)}">${signed(upl)}</div></div>` +
    `<div class="row sub"><div>${qty} contract${qty === 1 ? "" : "s"} @ ${entry.toFixed(2)} → <b style="color:var(--text)">${now.toFixed(2)}</b>${isFinite(bid) ? " if sold now" : ""}</div><div class="${cls(upl)}">${pct(uplPct)}</div></div>` +
    mtLine(p.symbol) +
    `<div class="levels"><span>Bot sells at <b style="color:var(--green)">+60%</b> (${(entry * 1.6).toFixed(2)})</span>` +
    `<span><b style="color:var(--red)">−40%</b> (${(entry * 0.6).toFixed(2)})</span><span>or <b>20 min</b></span></div>` +
    sellButton(p.symbol, "Sell now") + `</div>`;
}

// A coin the bot holds
function cryptoCard(p) {
  const qty = num(p.qty), entry = num(p.avg_entry_price), now = num(p.current_price);
  const upl = (now - entry) * qty, uplPct = entry ? ((now - entry) / entry) * 100 : 0;
  const px = (v) => v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `<div class="card"><div class="row"><div><span class="sym">${esc(coinOf(p.symbol))}</span><span class="tag swing">CRYPTO</span></div>` +
    `<div class="big ${cls(upl)}">${signed(upl)}</div></div>` +
    `<div class="row sub"><div>${money(qty * now)} @ ${px(entry)} \u2192 <b style="color:var(--text)">${px(now)}</b></div><div class="${cls(upl)}">${pct(uplPct)}</div></div>` +
    `<div class="note" style="margin-top:6px">The bot sells it at its stop or target, if its uptrend breaks, or after 48 hours.</div>` +
    sellButton(p.symbol, "Sell now (instead of the bot)") + `</div>`;
}

// A stock held overnight (the bot's or yours)
function swingCard(p) {
  const b = S.swingBook[p.symbol] || {};
  const qty = num(p.qty), entry = num(p.avg_entry_price), now = num(p.current_price);
  const upl = (now - entry) * qty, uplPct = entry ? ((now - entry) / entry) * 100 : 0;
  const stopLeg = (b.legs || []).find((l) => (l.type === "stop" || l.type === "stop_limit") && !["canceled", "filled", "expired"].includes(l.status));
  const tpLeg = (b.legs || []).find((l) => l.type === "limit" && !["canceled", "filled", "expired"].includes(l.status));
  const day = num(p.change_today);
  const held = b.at ? daysHeld(b.at) : 0;
  return `<div class="card"><div class="row"><div><span class="sym">${esc(p.symbol)}</span><span class="tag swing">SWING</span>` +
    `<span class="tag ${b.who === "you" ? "you" : "open"}">${b.who === "you" ? "YOURS" : "BOT"}</span></div>` +
    `<div class="big ${cls(upl)}">${signed(upl)}</div></div>` +
    `<div class="row sub"><div>${qty} sh @ ${entry.toFixed(2)} → <b style="color:var(--text)">${now.toFixed(2)}</b></div><div class="${cls(upl)}">${pct(uplPct)}</div></div>` +
    `<div class="levels"><span>Held <b>${held === 0 ? "since today" : held + (held === 1 ? " day" : " days")}</b></span>` +
    (isFinite(day) ? `<span>Today <b class="${cls(day)}">${pct(day * 100)}</b></span>` : "") +
    (stopLeg ? `<span>Stop <b style="color:var(--red)">${num(stopLeg.stop_price).toFixed(2)}</b></span>` : "") +
    (tpLeg ? `<span>Target <b style="color:var(--green)">${num(tpLeg.limit_price).toFixed(2)}</b></span>` : "") + `</div>` +
    (b.who === "bot" ? `<div class="note" style="margin-top:6px">The bot sells it at its stop or target, if its uptrend breaks, or after 10 trading days.</div>` : "") +
    sellButton(p.symbol, b.who === "you" ? "Sell" : "Sell now (instead of the bot)") + `</div>`;
}


function changeCls(c) { return !isFinite(c) ? "fl" : c > 0.005 ? "up" : c < -0.005 ? "dn" : "fl"; }
function changeTxt(c) { return isFinite(c) ? (c >= 0 ? "+" : "") + c.toFixed(2) + "%" : "\u2014"; }

function miniSpark(bars, prev, day) {
  if (!bars || bars.length < 2) return `<svg viewBox="0 0 100 34"></svg>`;
  const t0 = etInstant(day, 9, 30).getTime(), t1 = etInstant(day, 16, 0).getTime();
  let lo = Math.min(...bars.map((b) => b.l)), hi = Math.max(...bars.map((b) => b.h));
  if (isFinite(prev)) { lo = Math.min(lo, prev); hi = Math.max(hi, prev); }
  if (hi - lo < 1e-9) { hi += 0.01; lo -= 0.01; }
  const x = (t) => ((new Date(t).getTime() + 150000 - t0) / (t1 - t0)) * 100;
  const y = (v) => 2 + (1 - (v - lo) / (hi - lo)) * 30;
  const d = bars.map((b, i) => `${i ? "L" : "M"}${x(b.t).toFixed(2)},${y(b.c).toFixed(2)}`).join("");
  const col = !isFinite(prev) || bars.at(-1).c >= prev ? "#5fe08a" : "#ff5c4d";
  const base = isFinite(prev) ? `<line x1="0" x2="100" y1="${y(prev).toFixed(2)}" y2="${y(prev).toFixed(2)}" stroke="#3b3016" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>` : "";
  return `<svg viewBox="0 0 100 34" preserveAspectRatio="none">${base}<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function quoteRow(sym, removable) {
  const q = quote(sym);
  const held = S.positions.some((p) => p.symbol === sym) ? `<span class="held" title="Bot holds this"></span>` : "";
  const x = removable ? `<button class="x" data-act="unwatch" data-sym="${esc(sym)}" aria-label="Remove ${esc(sym)}">\u2715</button>` : "";
  if (!q) return `<div class="q"><span class="s">${esc(sym)}</span><span class="sub" style="flex:1">No data</span>${x}</div>`;
  const span = q.hi - q.lo;
  const at = span > 0 ? Math.max(0, Math.min(100, ((q.price - q.lo) / span) * 100)) : 50;
  const c = changeCls(q.chg);
  const dot = c === "up" ? "#5fe08a" : c === "dn" ? "#ff5c4d" : "#a38d63";
  let h = `<div class="q" data-act="expand" data-sym="${esc(sym)}"><span class="s">${esc(sym)}${held}</span>` +
    `<span class="rng" title="Today's low to high"><i style="left:${at.toFixed(1)}%;background:${dot}"></i></span>` +
    `<span class="p">${q.price.toFixed(2)}</span><span class="c ${c}">${changeTxt(q.chg)}</span>${x}</div>`;
  if (S.expanded === sym) {
    const day = sessionDay();
    h += `<div class="qx">${chart({ symbol: sym, day, bars: (S.mkBars[day] || {})[sym] || [], lines: [{ price: q.prev, color: "#a38d63" }] })}` +
      `<div class="levels"><span>Open <b>${isFinite(q.open) ? q.open.toFixed(2) : "\u2014"}</b></span>` +
      `<span>High <b>${isFinite(q.hi) ? q.hi.toFixed(2) : "\u2014"}</b></span><span>Low <b>${isFinite(q.lo) ? q.lo.toFixed(2) : "\u2014"}</b></span>` +
      `<span>Prev close <b>${isFinite(q.prev) ? q.prev.toFixed(2) : "\u2014"}</b></span></div>` + holdRow(sym, q) + `</div>`;
  }
  return h;
}

// ---------------- buy to hold (swing) ----------------
function holdLimits(price) {
  const left = Math.max(0, SWING_BUDGET - swingInUse());
  const power = num(S.account && S.account.buying_power);
  const max = Math.floor(Math.min(left, isFinite(power) ? power : left) / price);
  return { left, max };
}
function holdBlock(sym, max, left) {
  if (!S.clock || !S.account) return "Loading\u2026";
  if (!S.clock.is_open) return "You can buy to hold while the market is open (8:30 AM\u20133:00 PM CT).";
  if (S.positions.some((p) => p.symbol === sym)) return isSwing(sym) ? "Already a swing hold. See the Bot tab." : "The bot is day trading this one right now.";
  if (max < 1) return `${money(left)} of swing money left isn't enough for 1 share.`;
  return "";
}
function holdRow(sym, q) {
  const { left, max } = holdLimits(q.price);
  const block = holdBlock(sym, max, left);
  const qty = Math.max(1, Math.min(S.holdQty, Math.max(1, max)));
  if (block) return `<div class="note">${esc(block)}</div>`;
  return `<div class="row" style="margin-top:12px;align-items:center"><div class="step">` +
    `<button data-act="hold-qty" data-d="-1" aria-label="Fewer shares">\u2212</button><b>${qty}</b>` +
    `<button data-act="hold-qty" data-d="1" data-max="${max}" aria-label="More shares">+</button></div>` +
    `<div class="sub" style="text-align:right">\u2248 ${money(qty * q.price)}<br>${money(left)} of ${money(SWING_BUDGET)} swing money left</div></div>` +
    `<button class="qb hold" style="width:100%;margin-top:8px" data-act="hold" data-sym="${esc(sym)}">Buy ${qty} to hold</button>`;
}

// ---------------- options watch ----------------
function etMinutes(t = Date.now()) { const p = zoneParts(new Date(t), "America/New_York"); return +p.hour * 60 + +p.minute; }

// First 15 minutes' high/low and VWAP, the same way the bot works them out
function rangeOf(sym, day) {
  const bars = (S.mkBars[day] || {})[sym] || [];
  const end = etInstant(day, 9, 45).getTime();
  const early = bars.filter((b) => new Date(b.t).getTime() < end);
  let vol = 0, pv = 0;
  for (const b of bars) { vol += num(b.v); pv += num(b.vw || b.c) * num(b.v); }
  const vwap = vol > 0 ? pv / vol : NaN;
  if (!early.length) return null;
  return { hi: Math.max(...early.map((b) => b.h)), lo: Math.min(...early.map((b) => b.l)), vwap,
           done: day !== etDate(Date.now()) || Date.now() >= end };
}

function watchStatus(r, price) {
  if (!r.done) return ["wait", "Setting the range"];
  const up = r.hi * (1 + OPT_CHASE_PCT / 100), dn = r.lo * (1 - OPT_CHASE_PCT / 100);
  if (price > r.hi) {
    if (price > up) return ["late", "Ran past · too late"];
    if (isFinite(r.vwap) && price < r.vwap) return ["wait", "Above range, under VWAP"];
    return ["call", "▲ Breakout · call"];
  }
  if (price < r.lo) {
    if (price < dn) return ["late", "Fell past · too late"];
    if (isFinite(r.vwap) && price > r.vwap) return ["wait", "Below range, over VWAP"];
    return ["put", "▼ Breakdown · put"];
  }
  return ["wait", "Inside range · waiting"];
}

function meter(r, price) {
  const span = r.hi - r.lo || r.hi * 0.001;
  let a = Math.min(r.lo - span * 0.8, price), b = Math.max(r.hi + span * 0.8, price);
  const pad = (b - a) * 0.05; a -= pad; b += pad;
  const X = (v) => Math.max(0, Math.min(100, ((v - a) / (b - a)) * 100));
  const dn = r.lo * (1 - OPT_CHASE_PCT / 100), up = r.hi * (1 + OPT_CHASE_PCT / 100);
  const zone = (from, to, color) => `<span style="left:${X(from).toFixed(2)}%;width:${Math.max(0, X(to) - X(from)).toFixed(2)}%;background:${color}"></span>`;
  return `<div class="mtr">` +
    zone(a, dn, "rgba(245,185,66,.25)") + zone(dn, r.lo, "rgba(255,92,92,.75)") + zone(r.lo, r.hi, "#2a3644") +
    zone(r.hi, up, "rgba(46,204,113,.75)") + zone(up, b, "rgba(245,185,66,.25)") +
    `<i style="left:${X(price).toFixed(2)}%"></i></div>`;
}

function quickBlock() {
  if (!S.clock || !S.account) return "Loading…";
  if (!S.clock.is_open) return "Market is closed";
  const m = etMinutes();
  if (m < 9 * 60 + 31) return "Wait for the open";
  if (m >= 15 * 60) return "No new same-day options after 2:00 PM CT";
  if (S.mt) return "Finish your current option first";
  if (S.positions.some((p) => isOption(p.symbol))) return "Already holding an option (sell it first)";
  return "";
}

// ---------------- journal ----------------
// Which setup a trade came from, read off how its buy order was labeled
function setupOf(order, sym) {
  const t = (order && order.client_order_id) || "";
  if (t.startsWith("crypto-") || isCrypto(sym)) return "crypto";
  if (t.startsWith("app-opt-")) return "myopt";
  if (t.startsWith("app-swing-")) return "myhold";
  if (t.startsWith("app-")) return isOption(sym) ? "myopt" : "myhold";
  if (t.startsWith("swing-")) return "swing";
  if (t.startsWith("ict-")) return "ict";
  return isOption(sym) ? "0dte" : "orb";   // before labels existed, every bot stock day trade was a breakout
}

async function loadJournal() {
  if (!keys || S.jLoading) return;
  S.jLoading = true;
  try {
    const after = new Date(Date.now() - JOURNAL_DAYS * 864e5).toISOString();
    const fills = [];
    let token = "";
    for (let i = 0; i < 40; i++) {
      const page = await api(`/v2/account/activities/FILL?after=${encodeURIComponent(after)}&direction=asc&page_size=100` +
        (token ? `&page_token=${encodeURIComponent(token)}` : ""));
      fills.push(...page);
      if (page.length < 100) break;
      token = page.at(-1).id;
    }
    const orders = [], seen = new Set();
    let until = "";
    for (let i = 0; i < 10; i++) {
      const page = await api(`/v2/orders?status=all&after=${encodeURIComponent(after)}&limit=500&direction=desc&nested=true` +
        (until ? `&until=${encodeURIComponent(until)}` : ""));
      for (const o of page) if (!seen.has(o.id)) { seen.add(o.id); orders.push(o); }
      if (page.length < 500) break;
      until = page.at(-1).created_at;
    }
    const hist = await api("/v2/account/portfolio/history?period=3M&timeframe=1D").catch(() => null);
    S.journal = buildJournal(fills, orders, hist);
    S.jUpdate = Date.now(); S.jError = null;
  } catch (e) {
    S.jError = e instanceof AuthError ? "Alpaca rejected your keys. Check them in settings (⚙)."
      : e.network ? "Can't reach Alpaca right now. Retrying…" : e.message;
  } finally { S.jLoading = false; render(); }
}

// Turn fills into round trips (bought, then fully sold) and add them up
function buildJournal(fills, orders, hist) {
  const byId = {};
  for (const o of orders) {
    byId[o.id] = { o };
    for (const l of o.legs || []) byId[l.id] = { o: l, parent: o };
  }
  const open = {}, trades = [];
  const sorted = fills.slice().sort((a, b) => a.transaction_time.localeCompare(b.transaction_time));
  for (const f of sorted) {
    const sym = f.symbol, q = num(f.qty), p = num(f.price);
    if (!(q > 0) || !isFinite(p)) continue;
    let t = open[sym];
    const ref = byId[f.order_id];
    if (f.side === "buy") {
      if (!t) {
        const parent = ref && (ref.parent || ref.o);
        const sl = parent && (parent.legs || []).find((l) => l.type === "stop" || l.type === "stop_limit");
        t = open[sym] = { sym, setup: setupOf(parent, sym), entry: f.transaction_time, bq: 0, bc: 0, sq: 0, sp: 0,
          stop: sl ? num(sl.stop_price) : NaN };
      }
      t.bq += q; t.bc += q * p;
    } else {
      if (!t) continue; // bought before the journal's window
      t.sq += q; t.sp += q * p; t.exit = f.transaction_time;
      t.how = ref && ref.parent ? (ref.o.type === "limit" ? "Target hit" : "Stopped out") : "Sold";
      if (t.sq >= t.bq - 1e-9) {
        const m = mult(sym);
        t.avgIn = t.bc / t.bq; t.avgOut = t.sp / t.sq;
        t.pnl = (t.sp - t.bc) * m;
        t.r = isFinite(t.stop) && t.stop < t.avgIn ? (t.avgOut - t.avgIn) / (t.avgIn - t.stop) : NaN;
        t.key = `${sym}|${t.entry}`;
        trades.push(t);
        delete open[sym];
      }
    }
  }
  trades.sort((a, b) => a.exit.localeCompare(b.exit));
  const by = {};
  for (const t of trades) (by[t.setup] = by[t.setup] || []).push(t);
  const setups = Object.keys(SETUPS).filter((k) => by[k]).map((k) => ({ key: k, name: SETUPS[k], ...tally(by[k]) }));
  // longest run of losing trades in a row
  let run = 0, streak = 0;
  for (const t of trades) { run = t.pnl < -0.005 ? run + 1 : 0; streak = Math.max(streak, run); }
  // by time of day (Central), by entry hour
  const hours = {};
  for (const t of trades) {
    const h = +zoneParts(new Date(t.entry), TZ).hour;
    (hours[h] = hours[h] || []).push(t);
  }
  const byHour = Object.keys(hours).map(Number).sort((a, b) => a - b).map((h) => ({ h, ...tally(hours[h]) }));
  // equity curve: worst drop from a high, and the weekly pace
  const eq = hist && hist.equity ? hist.equity.map(num).filter((v) => v > 0) : [];
  let peak = -Infinity, dd = 0;
  for (const v of eq) { peak = Math.max(peak, v); dd = Math.max(dd, (peak - v) / peak * 100); }
  const weeks = (eq.length - 1) / 5;
  const weekly = eq.length >= 21 ? (Math.pow(eq.at(-1) / eq[0], 1 / weeks) - 1) * 100 : NaN;
  return { trades, setups, all: tally(trades), streak, byHour, dd: eq.length > 1 ? dd : NaN, weekly, weeks, openCount: Object.keys(open).length };
}

function tally(list) {
  const n = list.length;
  const wins = list.filter((t) => t.pnl > 0.005), losses = list.filter((t) => t.pnl < -0.005);
  const gw = wins.reduce((a, t) => a + t.pnl, 0), gl = losses.reduce((a, t) => a + t.pnl, 0);
  const total = list.reduce((a, t) => a + t.pnl, 0);
  const rs = list.map((t) => t.r).filter(isFinite);
  return { n, wins: wins.length, losses: losses.length, rate: n ? (wins.length / n) * 100 : NaN,
    avgWin: wins.length ? gw / wins.length : NaN, avgLoss: losses.length ? gl / losses.length : NaN,
    pf: gl < 0 ? gw / -gl : gw > 0 ? Infinity : NaN, total, exp: n ? total / n : NaN,
    avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : NaN,
    worst: losses.length ? Math.min(...losses.map((t) => t.pnl)) : 0 };
}

const fmtPct = (x, d = 0) => (isFinite(x) ? x.toFixed(d) + "%" : "—");
const fmtMoney = (x) => (isFinite(x) ? signed(x) : "—");
const fmtPf = (x) => (x === Infinity ? "∞" : isFinite(x) ? x.toFixed(2) : "—");
const fmtR = (x) => (!isFinite(x) ? "\u2014" : Math.abs(x) < 0.005 ? "0.00R" : (x > 0 ? "+" : "") + x.toFixed(2) + "R");
function when(iso) {
  return new Date(iso).toLocaleString("en-US", { timeZone: TZ, weekday: "short", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
}

    kpi("Max drawdown", isFinite(J.dd) ? "-" + J.dd.toFixed(1) + "%" : "—", J.dd > 10 ? "neg" : "") +
    kpi("Losses in a row", `${J.streak}`, J.streak >= 5 ? "neg" : "") + kpi("Avg result", fmtR(A.avgR), cls(A.avgR)) + `</div>`;

  // risk: the 2% rule
  const worstPct = (-A.worst / eq) * 100;
  const over = J.trades.filter((t) => -t.pnl / eq * 100 > 2);
  h += `<h2>Risk check · 2% rule</h2><div class="card">` +
    `<div class="row"><div>Bot risk per stock trade</div><b class="ok">${BOT_RISK_PCT}% ✓</b></div>` +
    `<div class="row" style="margin-top:6px"><div>Biggest single loss</div><b class="${worstPct > 2 ? "warn" : "ok"}">${A.worst < 0 ? signed(A.worst) : "—"} (${worstPct.toFixed(1)}%)</b></div>` +
    `<div class="row" style="margin-top:6px"><div>Losses over 2% of the account</div><b class="${over.length ? "warn" : "ok"}">${over.length}</b></div>` +
    (over.length ? `<div class="note">${over.length === 1 ? "That one came" : "Most of those came"} from ${esc(SETUPS[mostCommon(over.map((t) => t.setup))])}. Same-day options can lose up to 40% of their price before the bot sells (about ${Math.round(OPT_BUDGET_PCT * 0.4)}% of the account), so they break the 2% rule.</div>`
      : `<div class="note">Every loss so far stayed under 2% of the account.</div>`) + `</div>`;

  // compounding
  h += `<h2>Compounding</h2><div class="card">`;
  if (isFinite(J.weekly)) {
    const year = eq * Math.pow(1 + J.weekly / 100, 52);
    h += `<div class="row"><div>Pace over the last ${Math.round(J.weeks)} weeks</div><b class="${cls(J.weekly)}">${pct(J.weekly)} a week</b></div>` +
      `<div class="row" style="margin-top:6px"><div>If that pace held for a year</div><b>${money(year)}</b></div>` +
      `<div class="note">Not a prediction: it only holds if the edge holds and no big loss breaks the chain. 1% a week compounds to about +68% a year.</div>`;
  } else {
    h += `<div class="sub">Needs about 4 weeks of results to measure a pace. For scale: 1% a week compounds to about +68% a year; one 20% loss takes 25% of gains to win back.</div>`;
  }
  h += `</div>`;

  // edge by setup
  h += `<h2>Edge by setup</h2><div class="card"><table class="jt"><tr><th>Setup</th><th>Trades</th><th>Win</th><th>Avg W/L</th><th>Total</th></tr>` +
    J.setups.map((x) => `<tr><td>${esc(x.name)}</td><td>${x.n}</td><td>${fmtPct(x.rate)}</td>` +
      `<td><span class="pos">${isFinite(x.avgWin) ? "+" + x.avgWin.toFixed(2) : "—"}</span>/<span class="neg">${isFinite(x.avgLoss) ? x.avgLoss.toFixed(2) : "—"}</span></td>` +
      `<td class="${cls(x.total)}">${signed(x.total)}</td></tr>`).join("") + `</table>` +
    `<div class="note">A setup has an edge when "Per trade" stays positive over many trades. Under about 30 trades, these numbers are mostly luck.</div></div>`;

  // time of day
  const maxAbs = Math.max(...J.byHour.map((x) => Math.abs(x.total)), 0.01);
  h += `<h2>By time of day</h2><div class="card">` + J.byHour.map((x) => {
    const w = (Math.abs(x.total) / maxAbs) * 50, left = x.total >= 0 ? 50 : 50 - w;
    const lbl = new Date(2000, 0, 1, x.h).toLocaleTimeString("en-US", { hour: "numeric" });
    return `<div class="hbar"><span class="h">${lbl}</span><span class="bar"><i style="left:${left.toFixed(1)}%;width:${w.toFixed(1)}%;background:${x.total >= 0 ? "var(--green)" : "var(--red)"}"></i></span>` +
      `<span class="t"><span class="${cls(x.total)}">${signed(x.total)}</span> · ${x.n}</span></div>`;
  }).join("") + `<div class="note">Times are when trades started (Central). Look for hours that keep losing.</div></div>`;

  // the tape
  const list = J.trades.slice().reverse();
  h += `<h2>Trades</h2><div class="card">` + list.slice(0, S.jShow).map((t) => {
    const note = S.notes[t.key] || "";
    const tag = t.pnl > 0.005 ? "win" : t.pnl < -0.005 ? "loss" : "flat";
    let x = `<div class="jtrade"><div class="row"><div><b>${esc(nameOf(t.sym))}</b><span class="tag ${tag}">${esc(SETUPS[t.setup].toUpperCase())}</span></div>` +
      `<b class="${cls(t.pnl)}">${signed(t.pnl)}</b></div>` +
      `<div class="row sub"><div>${esc(when(t.entry))} · ${esc(t.how)}${isFinite(t.r) ? " · " + fmtR(t.r) : ""}</div>` +
      `<button class="linkbtn" data-act="jnote" data-key="${esc(t.key)}">${note ? "Edit note" : "Add note"}</button></div>`;
    if (S.jEdit === t.key) {
      x += `<form class="jnote-form" data-key="${esc(t.key)}"><input class="note-in" id="jnote-in" maxlength="200" placeholder="Why did it win or lose?" enterkeyhint="done" value="${esc(note)}"></form>`;
    } else if (note) x += `<div class="mynote">“${esc(note)}”</div>`;
    return x + `</div>`;
  }).join("") + (list.length > S.jShow ? `<button class="btn ghost" data-act="jmore">Show more (${list.length - S.jShow} left)</button>` : "") + `</div>`;
  h += `<button class="btn ghost" data-act="jcsv">Download as spreadsheet (CSV)</button>`;
  h += `<div class="note" style="text-align:center;margin-top:14px">Built from your Alpaca paper account. Notes are saved on this phone only.</div>`;
  return h;
}
function mostCommon(arr) {
  const c = {};
  for (const a of arr) c[a] = (c[a] || 0) + 1;
  return Object.keys(c).sort((a, b) => c[b] - c[a])[0];
}
function journalCsv() {
  const J = S.journal;
  if (!J) return;
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [["entry", "exit", "symbol", "setup", "qty", "avg_in", "avg_out", "pnl", "r", "exit_reason", "note"]];
  for (const t of J.trades) rows.push([t.entry, t.exit, nameOf(t.sym), SETUPS[t.setup], t.bq, t.avgIn.toFixed(4), t.avgOut.toFixed(4),
    t.pnl.toFixed(2), isFinite(t.r) ? t.r.toFixed(2) : "", t.how, S.notes[t.key] || ""]);
  const blob = new Blob([rows.map((r) => r.map(q).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `stinks-journal-${etDate(Date.now())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

document.addEventListener("click", (e) => {

  if (act === "boot-skip") endBoot();
  if (act === "logout") { forgetKeys(); keys = null; closeStreams(); Object.assign(S, { account: null, clock: null, showSettings: false, error: null }); render(); }
  if (act === "day") { S.day = b.dataset.day; render(); loadBars(S.day).then(render); }
  if (act === "tab") {
    S.tab = b.dataset.tab; savePref("paperbot_tab", S.tab); S.showSettings = false;
    window.scrollTo(0, 0); render();

    if (S.tab === "journal" && (!S.jUpdate || Date.now() - S.jUpdate > 60000)) loadJournal();
  }
  if (act === "jnote") {
    S.jEdit = S.jEdit === b.dataset.key ? null : b.dataset.key; render();
    setTimeout(() => { const el = $("#jnote-in"); if (el) el.focus(); }, 60);
  }
  if (act === "jmore") { S.jShow += 20; render(); }
  if (act === "jcsv") journalCsv();
  if (act === "sort") { S.sortBy = b.dataset.sort; savePref("paperbot_sort", S.sortBy); render(); }
  if (act === "timer") { S.timer = Number(b.dataset.sec); savePref("paperbot_timer", String(S.timer)); render(); }
  if (act === "qt") startQuick(b.dataset.und, b.dataset.kind);
  if (act === "sheet-cancel") { if (!(S.sheet && S.sheet.busy)) { S.sheet = null; render(); } }
  if (act === "sheet-buy") confirmSheet();
  if (act === "hold") openHold(b.dataset.sym);
  if (act === "hold-qty") {
    const max = Number(b.dataset.max || Infinity);
    S.holdQty = Math.max(1, Math.min(S.holdQty + Number(b.dataset.d), isFinite(max) ? max : S.holdQty + 1)); render();
  }
  if (act === "sell") {
    const sym = b.dataset.sym;
    if (S.armSell && S.armSell.sym === sym && Date.now() < S.armSell.until) sellPosition(sym, "");
    else { S.armSell = { sym, until: Date.now() + 3000 }; render(); setTimeout(render, 3100); }
  }
  if (act === "expand") {
    const sym = b.dataset.sym;
    S.expanded = S.expanded === sym ? null : sym; S.holdQty = 1; render();
    if (S.expanded) loadMktBars(sessionDay(), [sym]).then(render);
  }
  if (act === "unwatch") {
    S.myList = S.myList.filter((x) => x !== b.dataset.sym); saveMyList();

});
