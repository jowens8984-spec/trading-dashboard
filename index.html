// ---------------- live streams ----------------
let tws = null, dws = null, tRetry = 0, dRetry = 0, dSyms = "", dLimited = false;
const decode = (m) => typeof m === "string" ? m : new TextDecoder().decode(m);

function closeStreams() {
  for (const w of [tws, dws]) try { w && w.close(); } catch (e) {}
  tws = dws = null; S.tradeWs = S.dataWs = "off"; dSyms = "";
}

function syncStreams() {
  if (!keys || !S.clock) return;
  if (!tws && document.visibilityState === "visible") openTradeStream();
  const syms = S.positions.map((p) => p.symbol).filter((x) => !isOption(x) && !isCrypto(x)).sort().join(",");
  const wantData = S.clock.is_open && syms && !dLimited && document.visibilityState === "visible";
  if (!wantData) { if (dws) { try { dws.close(); } catch (e) {} dws = null; dSyms = ""; } return; }
  if (!dws) openDataStream();
  else if (syms !== dSyms && S.dataWs === "live") subscribeData(syms);
}

function openTradeStream() {
  let ws;
  try { ws = new WebSocket(TRADE_WS); } catch (e) { return; }
  tws = ws; ws.binaryType = "arraybuffer"; S.tradeWs = "connecting";
  let triedLegacy = false;
  ws.onopen = () => ws.send(JSON.stringify({ action: "auth", key: keys.key, secret: keys.secret }));
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(decode(ev.data)); } catch (e) { return; }
    if (m.stream === "authorization") {
      if (m.data && m.data.status === "authorized") {
        tRetry = 0; S.tradeWs = "live"; render();
        ws.send(JSON.stringify({ action: "listen", data: { streams: ["trade_updates"] } }));
      } else if (!triedLegacy) {
        triedLegacy = true;
        ws.send(JSON.stringify({ action: "authenticate", data: { key_id: keys.key, secret_key: keys.secret } }));
      }
    } else if (m.stream === "trade_updates" && m.data) {
      onTradeUpdate(m.data);
    }
  };
  ws.onclose = () => {
    if (tws !== ws) return;
    tws = null; S.tradeWs = "off"; render();
    if (keys && document.visibilityState === "visible") setTimeout(syncStreams, Math.min(30000, 2000 * 2 ** tRetry++));
  };
  ws.onerror = () => {};
}

let refreshTimer = null;
function onTradeUpdate(d) {
  const o = d.order || {};
  if (d.event === "fill" || d.event === "partial_fill") {
    const side = o.side === "buy" ? "BOUGHT" : "SOLD";
    toast(`${side} ${num(d.qty || o.filled_qty)} ${nameOf(o.symbol || "")} @ ${num(d.price || o.filled_avg_price).toFixed(2)}`);
    try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
  }
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(loadAll, 1200);
}

function openDataStream() {
  let ws;
  try { ws = new WebSocket(DATA_WS); } catch (e) { return; }
  dws = ws; S.dataWs = "connecting";
  ws.onmessage = (ev) => {
    let arr; try { arr = JSON.parse(decode(ev.data)); } catch (e) { return; }
    for (const m of [].concat(arr)) {
      if (m.T === "success" && m.msg === "connected") ws.send(JSON.stringify({ action: "auth", key: keys.key, secret: keys.secret }));
      else if (m.T === "success" && m.msg === "authenticated") { dRetry = 0; S.dataWs = "live"; subscribeData(S.positions.map((p) => p.symbol).filter((x) => !isOption(x) && !isCrypto(x)).sort().join(",")); }
      else if (m.T === "error") { if ([402, 406, 409].includes(m.code)) dLimited = true; try { ws.close(); } catch (e) {} }
      else if (m.T === "t") onLiveTrade(m.S, m.p, m.t);
    }
  };
  ws.onclose = () => {
    if (dws !== ws) return;
    dws = null; S.dataWs = "off"; dSyms = "";
    if (!dLimited && keys && document.visibilityState === "visible") setTimeout(syncStreams, Math.min(30000, 3000 * 2 ** dRetry++));
  };
  ws.onerror = () => {};
}

function subscribeData(syms) {
  if (!dws || dws.readyState !== 1) return;
  const old = dSyms ? dSyms.split(",") : [];
  if (old.length) dws.send(JSON.stringify({ action: "unsubscribe", trades: old }));
  if (syms) dws.send(JSON.stringify({ action: "subscribe", trades: syms.split(",") }));
  dSyms = syms;
}

function onLiveTrade(sym, price, ts) {
  const p = S.positions.find((x) => x.symbol === sym);
  if (!p || !isFinite(price)) return;
  p.current_price = String(price);
  // update today's candle for this symbol
  const day = etDate(Date.now());
  const tms = new Date(ts).getTime();
  if (tms >= etInstant(day, 9, 30).getTime() && tms < etInstant(day, 16, 0).getTime()) {
    const dayBars = (S.barsByDay[day] = S.barsByDay[day] || {});
    const arr = (dayBars[sym] = dayBars[sym] || []);
    const bucket = new Date(Math.floor(new Date(ts).getTime() / 300000) * 300000).toISOString();
    const last = arr.at(-1);
    if (last && new Date(last.t).getTime() === new Date(bucket).getTime()) {
      last.h = Math.max(last.h, price); last.l = Math.min(last.l, price); last.c = price;
    } else if (!last || new Date(bucket) > new Date(last.t)) {
      arr.push({ t: bucket, o: price, h: price, l: price, c: price, v: 0 });
    }
  }
  // keep the header in step with live prices
  if (S.account) {
    const mv = S.positions.reduce((s, q) => s + num(q.qty) * num(q.current_price) * mult(q.symbol), 0);
    S.account.equity = String(num(S.account.cash) + mv);
  }
  render();
}

// ---------------- your trades ----------------
// Find today's closest-to-the-money call/put that fits the budget, then show the confirm sheet
async function startQuick(und, kind) {
  const block = quickBlock();
  if (block) { toast(block); return; }
  const q = quote(und);
  if (!q) { toast(`No ${und} price yet`); return; }
  S.qtBusy = und + kind; render();
  try {
    const price = q.price, today = etDate(Date.now());
    const [lo, hi] = kind === "call" ? [price * 0.995, price * 1.02] : [price * 0.98, price * 1.005];
    const res = await api(`/v1beta1/options/snapshots/${und}?feed=indicative&type=${kind}&expiration_date=${today}` +
      `&strike_price_gte=${lo.toFixed(2)}&strike_price_lte=${hi.toFixed(2)}&limit=250`, DATA);
    const a = S.account;
    const budget = Math.min(num(a.equity) * OPT_BUDGET_PCT / 100, num(a.options_buying_power || a.buying_power));
    let best = null;
    for (const [sym, sn] of Object.entries((res && res.snapshots) || {})) {
      if (!isOption(sym) || (sym.at(-9) === "C") !== (kind === "call")) continue;
      const lq = sn.latestQuote || {}, ask = num(lq.ap), bid = num(lq.bp);
      if (!(bid > 0) || !(ask >= 0.1) || ask * 100 > budget) continue;
      const strike = +sym.slice(-8) / 1000;
      if (!best || Math.abs(strike - price) < best.dist) best = { sym, ask, bid, strike, dist: Math.abs(strike - price) };
    }
    if (!best) { toast(`No ${und} ${kind} under ${money(budget)} right now`); return; }
    S.sheet = { type: "opt", und, kind, price, timer: S.timer, at: Date.now(), ...best };
  } catch (e) {
    toast(e instanceof AuthError ? "Alpaca rejected the request" : "Couldn't load option prices. Try again.");
  } finally { S.qtBusy = null; render(); }
}

function openHold(sym) {
  const q = quote(sym);
  if (!q) { toast(`No ${sym} price yet`); return; }
  const { left, max } = holdLimits(q.price);
  const block = holdBlock(sym, max, left);
  if (block) { toast(block); return; }
  const qty = Math.max(1, Math.min(S.holdQty, max));
  S.sheet = { type: "hold", sym, qty, price: q.price, left, stop: Math.round(q.price * (1 - SWING_STOP_PCT / 100) * 100) / 100 };
  render();
}

async function confirmSheet() {
  const sh = S.sheet;
  if (!sh || sh.busy) return;
  sh.busy = true; sh.err = null; render();
  try {
    if (sh.type === "opt") {
      const o = await apiSend("POST", "/v2/orders", { symbol: sh.sym, qty: "1", side: "buy", type: "market",
        time_in_force: "day", client_order_id: `app-opt-${Date.now()}` });
      S.mt = { id: o.id, sym: sh.sym, timer: sh.timer, placed: Date.now(), state: "pending" }; saveMt();
      toast(`Order sent: 1 ${optLabel(sh.sym)}`);
      setTimeout(tickManual, 600);
    } else {
      await apiSend("POST", "/v2/orders", { symbol: sh.sym, qty: String(sh.qty), side: "buy", type: "market",
        time_in_force: "gtc", order_class: "oto", stop_loss: { stop_price: sh.stop.toFixed(2) },
        client_order_id: `app-swing-${Date.now()}` });
      toast(`Order sent: ${sh.qty} ${sh.sym} to hold`);
      S.swingSig = null; setTimeout(loadAll, 1500);
    }
    S.sheet = null;
  } catch (e) {
    sh.busy = false; sh.err = e.message || "Order didn't go through";
  }
  render();
}

// Cancel any stop/target orders on it, then sell the whole position
async function sellPosition(sym, why) {
  S.armSell = null; render();
  try {
    // a coin's orders are listed as "BTC/USD", so look through all open orders for it
    const open = isCrypto(sym)
      ? (await api(`/v2/orders?status=open&limit=500`)).filter((o) => o.symbol.replace("/", "") === sym.replace("/", ""))
      : await api(`/v2/orders?status=open&symbols=${encodeURIComponent(sym)}`);
    for (const o of open || []) await apiSend("DELETE", `/v2/orders/${o.id}`).catch(() => {});
    await apiSend("DELETE", `/v2/positions/${encodeURIComponent(sym)}`);
    toast(why ? `${why}: selling ${nameOf(sym)}` : `Selling ${nameOf(sym)}`);
  } catch (e) {
    if (e.status === 404) toast(`${nameOf(sym)} was already sold`);
    else { toast(`Couldn't sell ${nameOf(sym)}: ${e.message}`); return false; }
  }
  if (S.mt && S.mt.sym === sym) clearMt();
  S.swingSig = null;
  setTimeout(loadAll, 1200);
  return true;
}

// Every second: watch your option order fill, run the auto-sell timer, refresh option bids
let mtBusy = false, ticksQ = 0;
async function tickManual() {
  if (!keys || document.visibilityState !== "visible") return;
  const m = S.mt;
  if (m && !mtBusy) {
    mtBusy = true;
    try {
      if (m.state === "pending") {
        const o = await apiSend("GET", `/v2/orders/${m.id}`);
        if (o.status === "filled") {
          m.state = "open"; m.filledAt = Date.parse(o.filled_at) || Date.now();
          m.sellAt = m.timer ? m.filledAt + m.timer * 1000 : null; saveMt(); loadAll();
        } else if (["canceled", "expired", "rejected", "done_for_day"].includes(o.status)) {
          if (!m.canceling) toast(`Order ${o.status}: ${optLabel(m.sym)}`);
          clearMt(); loadAll();
        } else if (Date.now() - m.placed > 20000 && !m.canceling) {
          m.canceling = true; saveMt();
          await apiSend("DELETE", `/v2/orders/${m.id}`).catch(() => {});
          toast("No fill in 20 seconds, so the order was canceled");
        }
      } else if (m.sellAt && Date.now() >= m.sellAt) {
        const ok = await sellPosition(m.sym, "Timer up");
        if (!ok && S.mt) { S.mt.sellAt = Date.now() + 3000; saveMt(); }
      } else if (S.lastUpdate > (m.filledAt || 0) + 5000 && !S.positions.some((p) => p.symbol === m.sym)) {
        clearMt(); // already sold (by you, the bot's safety exits, or end of day)
      }
    } catch (e) {
      if (e.status === 404) clearMt();
    } finally { mtBusy = false; }
  }
  const opts = S.positions.filter((p) => isOption(p.symbol)).map((p) => p.symbol);
  if (opts.length && ticksQ++ % 3 === 0) {
    api(`/v1beta1/options/quotes/latest?symbols=${opts.map(encodeURIComponent).join(",")}&feed=indicative`, DATA)
      .then((r) => { for (const [s, q] of Object.entries((r && r.quotes) || {})) S.optQ[s] = { bp: q.bp, ap: q.ap, at: Date.now() }; render(); })
      .catch(() => {});
  }
  if (S.mt || opts.length || S.armSell) render();
}
setInterval(tickManual, 1000);

// ---------------- toast ----------------
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
}

// ---------------- polling ----------------
let ticks = 0;
function refresh() {
  if (S.tab === "market") { loadMarket(); if (ticks++ % 3 === 0) loadAll(); }
  else loadAll();
  if (S.tab === "journal" && (!S.jUpdate || Date.now() - S.jUpdate > 60000)) loadJournal();
}
function schedule() {
  const open = S.clock && S.clock.is_open;
  const wait = S.tab === "market" ? (open ? 10000 : 60000) : (open ? 15000 : 120000);
  setTimeout(() => { if (document.visibilityState === "visible") refresh(); schedule(); }, wait);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { ticks = 0; refresh(); tickManual(); }
  else { closeStreams(); }
});

// ---------------- startup screen ----------------
let bootOver = false;
function endBoot() {
  if (bootOver) return;
  bootOver = true;
  const el = $("#boot");
  if (!el) return;
  el.classList.add("done");
  setTimeout(() => el.remove(), 400);
}
async function runBoot() {
  const el = $("#boot");
  if (!el || getComputedStyle(el).display === "none") { if (el) el.remove(); bootOver = true; return; }
  const log = $("#boot-log"), bar = $(".boot-bar i");
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm ? 0 : ms));
  const uplink = () => !keys ? ["NO KEYS // SETUP", "warn"] : S.account ? ["LINKED", "ok"] : S.error ? ["OFFLINE", "warn"] : ["CONNECTING", "warn"];
  const steps = [
    ["> CORE SYSTEMS ...............", () => ["OK", "ok"]],
    ["> MODULES ORB/SWEEP/0DTE/SWING", () => ["OK", "ok"]],
    ["> ACCOUNT MODE ...............", () => ["PAPER", "ok"]],
    ["> UPLINK ALPACA ..............", uplink],
  ];
  let html = "STINKS v1.0 // PAPER TRADING TERMINAL\n";
  log.innerHTML = html + `<span class="cur"></span>`;
  for (let i = 0; i < steps.length && !bootOver; i++) {
    const [label, result] = steps[i];
    log.innerHTML = html + esc(label) + ` <span class="cur"></span>`;
    await wait(i === steps.length - 1 ? 650 : 330);
    if (i === steps.length - 1) for (let t = 0; t < 8 && keys && !S.account && !S.error && !bootOver; t++) await wait(150);
    const [txt, cls] = result();
    html += `${esc(label)} <span class="${cls}">${txt}</span>\n`;
    log.innerHTML = html + `<span class="cur"></span>`;
    bar.style.width = `${((i + 1) / steps.length) * 100}%`;
  }
  if (bootOver) return;
  html += keys ? "\n> WELCOME BACK, OPERATOR." : "\n> ENTER YOUR PAPER KEYS TO BEGIN.";
  log.innerHTML = html + `<span class="cur"></span>`;
  await wait(700);
  if (calm) await new Promise((r) => setTimeout(r, 900));
  endBoot();
}

render();
if (keys) { loadAll(); if (S.tab === "market") loadMarket(); if (S.tab === "journal") loadJournal(); }
schedule();
runBoot();
</script>
